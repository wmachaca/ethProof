[profile.default]
src = "src"
out = "out"
libs = ["lib"]

remappings = [
    # CRITICAL: Optimism internal imports MUST come first
    "src/libraries/=lib/optimism/packages/contracts-bedrock/src/libraries/",
    "src/=lib/optimism/packages/contracts-bedrock/src/",
    
    # Then your project-specific remappings
    "@eth-optimism/contracts-bedrock=lib/optimism/packages/contracts-bedrock/src",
    "solidity-rlp=lib/solidity-rlp/contracts",
    '@openzeppelin/contracts=lib/openzeppelin-contracts/contracts',
    "forge-std=lib/forge-std/src"
]

fs_permissions = [{ access = "read-write", path = "./" }]

solc_version = "0.8.19"
optimizer = true
optimizer_runs = 1000000